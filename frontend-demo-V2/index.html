<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retail Core POS — Demo Giao Diện Stitch V2 (17 màn hình)</title>
  <style>
    :root {
      --navy: #1E3A8A;
      --royal: #2563EB;
      --teal: #0D9488;
      --amber: #D97706;
      --bg: #F8FAFC;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    aside {
      width: 310px;
      background: #FFFFFF;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand {
      padding: 16px 18px;
      background: var(--navy);
      color: #FFFFFF;
    }
    .brand h1 { margin: 0; font-size: 16px; font-weight: 700; }
    .brand p { margin: 4px 0 0; font-size: 12px; color: #BFDBFE; }
    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 10px 20px;
    }
    .group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 10px 8px 4px;
    }
    .nav-btn {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 2px;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: #F1F5F9; }
    .nav-btn.active {
      background: #EFF6FF;
      border-color: #BFDBFE;
    }
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .nav-code { font-size: 12px; font-weight: 700; color: var(--navy); }
    .nav-title { font-size: 12.5px; color: var(--text); font-weight: 500; }
    .pill {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .pill-ok { background: #CCFBF1; color: #0F766E; }
    .pill-warn { background: #FEF3C7; color: #B45309; }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    header {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .meta-title { font-size: 15px; font-weight: 700; color: var(--navy); }
    .meta-note { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .btn {
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: var(--navy);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #F1F5F9; }
    .btn.active { background: var(--royal); color: #FFFFFF; border-color: var(--royal); }
    .viewer {
      flex: 1;
      position: relative;
      background: #E2E8F0;
      overflow: auto;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #FFFFFF;
      display: block;
    }
    .img-wrap {
      display: none;
      padding: 20px;
      text-align: center;
    }
    .img-wrap img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.14);
      background: #FFFFFF;
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>Retail Core POS — Stitch V2</h1>
      <p>17 màn hình · Phủ đủ 8 nhóm / 31 chức năng</p>
    </div>
    <div id="nav-list" class="nav-scroll"></div>
  </aside>
  <section class="main">
    <header>
      <div>
        <div id="cur-title" class="meta-title">Đang tải...</div>
        <div id="cur-note" class="meta-note"></div>
      </div>
      <div class="controls">
        <button id="btn-html" class="btn active" onclick="setMode('html')">Xem HTML trực tiếp</button>
        <button id="btn-img" class="btn" onclick="setMode('img')">Xem ảnh thiết kế (PNG)</button>
        <a id="btn-open" class="btn" href="#" target="_blank">Mở tab riêng ↗</a>
      </div>
    </header>
    <div class="viewer">
      <iframe id="frame" src=""></iframe>
      <div id="img-wrap" class="img-wrap"><img id="preview-img" src="" alt="Screen preview" /></div>
    </div>
  </section>

    let current = SCREENS[0];
    let mode = 'html';

    function renderNav() {
      const groups = [...new Set(SCREENS.map(s => s.group))];
      const root = document.getElementById('nav-list');
      root.innerHTML = groups.map(g => {
        const items = SCREENS.filter(s => s.group === g);
        return `<div class="group-title">${g}</div>` + items.map(s => `
          <button class="nav-btn ${s.id === current.id ? 'active' : ''}" onclick="selectScreen('${s.id}')">
            <div class="nav-row">
              <span class="nav-code">${s.code} · ${s.owner}</span>
              <span class="pill ${s.status.startsWith('V2') ? 'pill-ok' : 'pill-warn'}">${s.status}</span>
            </div>
            <div class="nav-title">${s.title}</div>
          </button>
        `).join('');
      }).join('');
    }

    function selectScreen(id) {
      current = SCREENS.find(s => s.id === id) || SCREENS[0];
      document.getElementById('cur-title').textContent = `${current.code} — ${current.title} (${current.owner})`;
      document.getElementById('cur-note').textContent = current.note;
      document.getElementById('btn-open').href = current.html;
      document.getElementById('frame').src = current.html;
      document.getElementById('preview-img').src = current.img;
      renderNav();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('btn-html').classList.toggle('active', m === 'html');
      document.getElementById('btn-img').classList.toggle('active', m === 'img');
      document.getElementById('frame').style.display = m === 'html' ? 'block' : 'none';
      document.getElementById('img-wrap').style.display = m === 'img' ? 'block' : 'none';
    }

    selectScreen(SCREENS[0].id);
  </script>

</html>
